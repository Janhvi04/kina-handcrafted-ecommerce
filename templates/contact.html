{% extends "base.html" %}
{% block title %}Contact Us{% endblock title %}


{% block content %}


<div class="container bg-dark  p-3 mx-auto mt-5 w-50 shadow" style="max-width: 550px;">
  {% for message in messages %}
        <div class="alert alert-{{message.tags}} alert-dismissible fade show"role="alert">
          <strong>{{message}}</strong>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}

  <h1 class="text-center">Contact Us</h1>

  <div class="row">
    <div class="col-md-3"></div>
    <div class="col-md-6"></div>
    <form action="/contact/" method="post">{% csrf_token %}
      <div class="form-group">

        <input type="text" class="form-control" id="name" name='name'
          placeholder="Enter Your Name" required>
      </div>
      <br>
      <div class="form-group">

        <input type="email" class="form-control" id="email" name='email' value="{{user.email}}"
          placeholder="Enter Your Email"  required>
      </div>
      <br>
      <div class="form-group">

        <input type="tel" class="form-control" id="phone" name='phone'
          placeholder="Enter Your Phone Number">
      </div>
      <br>

      <div class="form-group">

        <textarea class="form-control" id="desc" name='desc' placeholder="Enter Your Message"
          rows="3"></textarea>
      </div>
      <br>
      <button type="submit" class="btn btn-success">Contact</button>
    </form>

  </div>

</div>

{% endblock content %}


{% block body %}

{% endblock body %}
